name: Release

# Creates the v<version> tag and the GitHub Release (notes taken from CHANGELOG.md) and then
# starts the Build workflow on the tag with publish=true (multi-arch image, Trivy, cosign).
# Run it from the branch or commit that should be released.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, for example 0.1.0 or 0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the tag and the release
      actions: write    # start the Build workflow on the new tag
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version and changelog
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-rc.1, got: $VERSION"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi

      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        run: |
          flags=""
          if [[ "$VERSION" == *-* ]]; then flags="--prerelease"; fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --verify-tag $flags

      - name: Build, scan, publish and sign the image
        run: gh workflow run build.yml --ref "v$VERSION" -f publish=true
