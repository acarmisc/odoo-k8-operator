name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Pinned kind release and node image. Bump deliberately.
  KIND_VERSION: v0.29.0
  KIND_NODE_IMAGE: kindest/node:v1.34.0
  # Must match KIND_CLUSTER in the Makefile so `setup-test-e2e` reuses the cluster.
  KIND_CLUSTER: odoo-k8-operator-test-e2e

jobs:
  test-e2e:
    name: e2e on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 120s

      - name: Run e2e tests
        env:
          CERT_MANAGER_INSTALL_SKIP: "true"
          # The addon step syncs e2e-addons/ from GitHub at this commit, so it must be pushed.
          # For pull_request events github.sha is a merge commit that is not on GitHub: use the head.
          E2E_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make test-e2e

      - name: Export kind logs on failure
        if: failure()
        run: kind export logs "${RUNNER_TEMP}/kind-logs" --name "${KIND_CLUSTER}"

      - name: Upload kind logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs
          path: ${{ runner.temp }}/kind-logs
          if-no-files-found: warn
          retention-days: 7
