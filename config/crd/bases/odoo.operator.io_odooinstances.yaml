                properties:
                  modules:
                    description: Modules to update with -u after addon commits change.
                      Use ["all"] for every module.
                    items:
                      pattern: ^[a-zA-Z0-9_]+$
                      type: string
                    maxItems: 100
                    minItems: 1
                    type: array
                  timeoutSeconds:
                    description: TimeoutSeconds for each generated OdooUpgrade. Defaults
                      to 1800.
                    format: int64
                    maximum: 86400
                    minimum: 60
