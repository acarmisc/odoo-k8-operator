---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: odooinstances.odoo.operator.io
spec:
  group: odoo.operator.io
  names:
    kind: OdooInstance
    listKind: OdooInstanceList
    plural: odooinstances
    singular: odooinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              addonsVolume:
                properties:
                  accessMode:
                    description: |-
                      AccessMode of the PVC. Defaults to ReadWriteOnce; use ReadWriteMany when
                      running more than one replica.
                    enum:
                    - ReadWriteOnce
                    - ReadWriteMany
                    type: string
                  size:
                    type: string
                  storageClass:
                    type: string
                type: object
              adminPasswordSecret:
                description: |-
                  AdminPasswordSecret names a Secret (key "password") holding Odoo's master
                  (database manager) password. It is injected as an environment variable and
                  passed to Odoo via --admin-passwd, never written to the ConfigMap.
                type: string
              config:
                additionalProperties:
                  type: string
                type: object
              dataVolume:
                description: |-
                  DataVolumeSpec configures persistent storage for Odoo's data_dir
                  (filestore, sessions) mounted at /var/lib/odoo. Without this, attachments
                  such as product images live on the pod's ephemeral filesystem and are
                  lost on every restart.
                properties:
                  accessMode:
                    description: |-
                      AccessMode of the PVC. Defaults to ReadWriteOnce; use ReadWriteMany when
                      running more than one replica.
                    enum:
                    - ReadWriteOnce
                    - ReadWriteMany
                    type: string
                  retainOnDelete:
                    description: |-
                      RetainOnDelete keeps the data PVC (filestore) when the OdooInstance is
                      deleted. Defaults to true; set to false to garbage-collect it with the instance.
                    type: boolean
                  size:
                    type: string
                  storageClass:
                    type: string
                type: object
              edition:
                type: string
              image:
                type: string
              postgres:
                properties:
                  database:
                    type: string
                  host:
                    type: string
                  passwordSecret:
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  user:
                    type: string
                type: object
              replicas:
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              resources:
                description: ResourceRequirements describes the compute resource requirements.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              upgrade:
                description: |-
                  Upgrade makes the operator run `odoo -u <modules>` (via an OdooUpgrade) whenever the
                  set of synced addon commits changes, and only roll the pods out once it succeeded.
                properties:
                  modules:
                    description: Modules to update with -u after addon commits change.
                      Use ["all"] for every module.
                    items:
                      pattern: ^[a-zA-Z0-9_]+$
                      type: string
                    maxItems: 100
                    minItems: 1
                    type: array
                  timeoutSeconds:
                    description: TimeoutSeconds for each generated OdooUpgrade. Defaults
                      to 1800.
                    format: int64
                    maximum: 86400
                    minimum: 60
                    type: integer
                required:
                - modules
                type: object
              version:
                type: string
            type: object
            x-kubernetes-validations:
            - message: replicas > 1 requires dataVolume.accessMode=ReadWriteMany (the
                filestore must be shared by all pods)
              rule: '!has(self.replicas) || self.replicas <= 1 || (has(self.dataVolume)
                && has(self.dataVolume.accessMode) && self.dataVolume.accessMode ==
                ''ReadWriteMany'')'
            - message: replicas > 1 requires addonsVolume.accessMode=ReadWriteMany
              rule: '!has(self.replicas) || self.replicas <= 1 || (has(self.addonsVolume)
                && has(self.addonsVolume.accessMode) && self.addonsVolume.accessMode
                == ''ReadWriteMany'')'
          status:
            properties:
              activeUpgrade:
                description: ActiveUpgrade names the OdooUpgrade currently gating
                  a rollout, if any.
                type: string
              addonPaths:
                items:
                  type: string
                type: array
              appliedAddonsHash:
                description: |-
                  AppliedAddonsHash is the addons hash the running pods were rolled out with. With
                  spec.upgrade set it only advances after the matching OdooUpgrade succeeded.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              ready:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
