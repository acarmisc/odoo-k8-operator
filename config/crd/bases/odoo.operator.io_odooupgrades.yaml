---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: odooupgrades.odoo.operator.io
spec:
  group: odoo.operator.io
  names:
    kind: OdooUpgrade
    listKind: OdooUpgradeList
    plural: odooupgrades
    singular: odooupgrade
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OdooUpgradeSpec describes a one-shot `odoo -u/-i ... --stop-after-init` run against
              the database of an OdooInstance. The spec is immutable: to run another upgrade create
              a new OdooUpgrade.
            properties:
              adminUserPasswordSecret:
                description: |-
                  AdminUserPasswordSecret names a Secret in the same namespace (key "password"). After
                  installModules succeeded, the value becomes the password of the Odoo user "admin",
                  set through `odoo shell`. The value reaches the Job only as an environment variable.
                  Requires installModules.
                type: string
              database:
                description: Database to upgrade. Defaults to the instance's postgres.database.
                pattern: ^[a-zA-Z0-9_.-]+$
                type: string
              installModules:
                description: InstallModules to install with -i.
                items:
                  pattern: ^[a-zA-Z0-9_]+$
                  type: string
                maxItems: 100
                type: array
              instanceRef:
                description: |-
                  InstanceRef names the OdooInstance (same namespace) whose image, config, addons and
                  database are used.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              modules:
                description: Modules to update with -u. Use ["all"] to update every
                  installed module.
                items:
                  pattern: ^[a-zA-Z0-9_]+$
                  type: string
                maxItems: 100
                type: array
              timeoutSeconds:
                description: TimeoutSeconds bounds the whole upgrade Job (activeDeadlineSeconds).
                  Defaults to 1800.
                format: int64
                maximum: 86400
                minimum: 60
                type: integer
              withDemo:
                description: |-
                  WithDemo loads demo data when installModules is set. Defaults to false, which
                  passes --without-demo=all.
                type: boolean
            required:
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new OdooUpgrade instead
              rule: self == oldSelf
            - message: at least one of modules or installModules is required
              rule: size(self.modules) > 0 || size(self.installModules) > 0
          status:
            properties:
              completionTime:
                format: date-time
                type: string
              conditions:
                description: Conditions hold Succeeded and Progressing. The reasons
                  are listed in docs/upgrades.md.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobName:
                description: JobName is the Kubernetes Job executing the upgrade.
                type: string
              message:
                description: Message carries the failure reason or the tail of the
                  Job log.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is one of Pending, Running, Succeeded, Failed.
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
