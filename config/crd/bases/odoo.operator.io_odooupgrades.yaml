---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: odooupgrades.odoo.operator.io
spec:
  group: odoo.operator.io
  names:
    kind: OdooUpgrade
    listKind: OdooUpgradeList
    plural: odooupgrades
    singular: odooupgrade
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OdooUpgradeSpec describes a one-shot `odoo -u/-i ... --stop-after-init` run against
              the database of an OdooInstance. The spec is immutable: to run another upgrade create
              a new OdooUpgrade.
            properties:
              database:
                description: Database to upgrade. Defaults to the instance's postgres.database.
                pattern: ^[a-zA-Z0-9_.-]+$
                type: string
              installModules:
                description: InstallModules to install with -i.
                items:
                  pattern: ^[a-zA-Z0-9_]+$
                  type: string
                maxItems: 100
                type: array
              instanceRef:
                description: |-
                  InstanceRef names the OdooInstance (same namespace) whose image, config, addons and
                  database are used.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              modules:
                description: Modules to update with -u. Use ["all"] to update every
                  installed module.
                items:
                  pattern: ^[a-zA-Z0-9_]+$
                  type: string
                maxItems: 100
                type: array
              timeoutSeconds:
                description: TimeoutSeconds bounds the whole upgrade Job (activeDeadlineSeconds).
                  Defaults to 1800.
                format: int64
                maximum: 86400
                minimum: 60
                type: integer
            required:
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new OdooUpgrade instead
              rule: self == oldSelf
            - message: at least one of modules or installModules is required
              rule: size(self.modules) > 0 || size(self.installModules) > 0
          status:
            properties:
              completionTime:
                format: date-time
                type: string
              jobName:
                description: JobName is the Kubernetes Job executing the upgrade.
                type: string
              message:
                description: Message carries the failure reason or the tail of the
                  Job log.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is one of Pending, Running, Succeeded, Failed.
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
