apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odoo-k8-operator
    app.kubernetes.io/managed-by: kustomize
  name: manager-role
  # ClusterRole used with namespace-scoped RoleBinding(s).
  # Grants access only within namespaces where a RoleBinding references this role.
  # Do NOT bind with a ClusterRoleBinding in production — use per-namespace RoleBindings.
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["events.k8s.io"]
  # The event recorder (mgr.GetEventRecorder) creates Events and patches repeated ones.
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  # list/watch are required because the cached client reads Secrets to hash them
  # and to re-reconcile instances when a referenced password rotates.
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["odoo.operator.io"]
  resources: ["odooinstances", "odooinstances/status", "odooinstances/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["odoo.operator.io"]
  resources: ["odooaddons", "odooaddons/status", "odooaddons/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["odoo.operator.io"]
  resources: ["odooupgrades", "odooupgrades/status", "odooupgrades/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["odoo.operator.io"]
  resources: ["odoobackups", "odoobackups/status", "odoobackups/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
