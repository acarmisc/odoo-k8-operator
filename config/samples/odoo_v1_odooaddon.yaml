apiVersion: odoo.operator.io/v1
kind: OdooAddon
metadata:
  labels:
    app.kubernetes.io/name: odoo-k8-operator
    app.kubernetes.io/managed-by: kustomize
  name: odooaddon-sample
spec:
  gitUrl: https://github.com/your-org/odoo-addons.git
  # Branch, tag or full 40-char commit SHA (pin a SHA in production).
  gitRef: main
  # Secret keys: token (+ optional username) for HTTPS; ssh-privatekey + known_hosts for SSH.
  gitSecretRef:
    name: odoo-addons-git
  instanceRef:
    name: odooinstance-sample
