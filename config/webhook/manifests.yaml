---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-odoo-operator-io-v1-odooaddon
  failurePolicy: Fail
  name: vodooaddon.kb.io
  rules:
  - apiGroups:
    - odoo.operator.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - odooaddons
  sideEffects: None
